{% extends "base.html" %}
{% block title %}Sign in · narrator.guru{% endblock %}
{% block body %}
<h1>Sign in</h1>
<form class="box" method="post" action="/signin/email/{{ token }}">
  <p style="margin-top:0">Signing in as <strong>{{ email }}</strong>.</p>
  <div class="actions"><button type="submit">Sign in</button></div>
</form>
{% endblock %}
