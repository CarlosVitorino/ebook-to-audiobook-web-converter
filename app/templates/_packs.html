<div class="packs">
{% for p in packs %}
  <form class="pack" method="post" action="/buy">
    <div>{{ p.name }}</div>
    <div class="price">{{ p.price }}</div>
    <div class="small">{{ p.note }}</div>
    <input type="hidden" name="pack" value="{{ p.id }}">
    <input type="hidden" name="email" value="{{ email or (job.email if job else '') }}">
    <button type="submit">Buy {{ p.name }}</button>
  </form>
{% endfor %}
</div>
