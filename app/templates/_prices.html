<table>
  <thead><tr><th>Pack</th><th class="num">Price</th><th class="num">Per book</th>{% if buy %}<th></th>{% endif %}</tr></thead>
  <tbody>
  {% if not buy %}<tr class="free"><td>First book</td><td class="num">free</td><td class="num">–</td></tr>{% endif %}
  {% for p in packs %}
    <tr class="{{ 'best' if p.id == 'five' }}">
      <td>{{ p.name }}</td><td class="num">{{ p.price }}</td><td class="num">{{ p.per_book }}</td>
      {% if buy %}<td class="num"><form method="post" action="/buy" style="margin:0"><input type="hidden" name="pack" value="{{ p.id }}">{% if draft %}<input type="hidden" name="draft" value="{{ draft }}">{% endif %}<button class="buy">Buy</button></form></td>{% endif %}
    </tr>
  {% endfor %}
  </tbody>
</table>
<p class="small">A book is up to about 10 hours of audio. Longer books count as two.</p>
