<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}narrator.guru: ebook to audiobook{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  /* Dark only, on purpose: it's the look of the product, not a user setting. */
  :root { color-scheme:dark; --fg:#eee; --bg:#151515; --muted:#aaa; --accent:#7aa2ff; --on-accent:#0b1530; --line:#333; --bad:#f87171; }
  body { font: 18px/1.55 system-ui, sans-serif; color:var(--fg); background:var(--bg); max-width:40rem; margin:0 auto; padding:2rem 1rem 4rem; }
  h1 { font-size:1.9rem; line-height:1.2; margin:.2rem 0 .5rem; }
  .lede { color:var(--muted); margin-top:0; }
  form.card, .card { border:1px solid var(--line); border-radius:12px; padding:1.25rem; margin:1.5rem 0; }
  label { display:block; font-weight:600; margin:.9rem 0 .3rem; }
  input[type=email], input[type=file] { width:100%; font:inherit; padding:.5rem; box-sizing:border-box; }
  .check { display:flex; gap:.6rem; align-items:flex-start; font-weight:400; }
  .check input { margin-top:.35rem; width:1.1rem; height:1.1rem; }
  button { font:inherit; font-weight:600; background:var(--accent); color:var(--on-accent); border:0; border-radius:8px; padding:.7rem 1.2rem; margin-top:1rem; cursor:pointer; }
  a.button { display:inline-block; background:var(--accent); color:var(--on-accent); border-radius:8px; padding:.7rem 1.2rem; font-weight:600; text-decoration:none; margin:.3rem .3rem 0 0; }
  a { color:var(--accent); }
  .error { color:var(--bad); font-weight:600; }
  .small { font-size:.9rem; color:var(--muted); }
  .packs { display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); gap:.6rem; }
  .pack { border:1px solid var(--line); border-radius:10px; padding:1rem; text-align:center; }
  .pack .price { font-size:1.6rem; font-weight:700; }
  .pack button { width:100%; }
  progress { width:100%; height:1.2rem; }
  .steps { font-size:.9rem; color:var(--muted); margin:0 0 1.2rem; }
  .steps b { color:var(--fg); }
  .brand { font-weight:700; color:var(--fg); text-decoration:none; }
  .sections { list-style:none; padding:0; margin:1rem 0; border-top:1px solid var(--line); }
  .sections li { border-bottom:1px solid var(--line); padding:.55rem 0; }
  .sections .row { display:flex; gap:.6rem; align-items:baseline; }
  .sections .row input { width:1.1rem; height:1.1rem; flex:none; position:relative; top:.15rem; }
  .sections .name { flex:1; min-width:0; }
  .sections .name .t { font-weight:600; }
  .sections .off .name { color:var(--muted); }
  .sections .off .name .t { font-weight:400; text-decoration:line-through; }
  .sections .preview { display:block; font-size:.85rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sections .words { font-size:.85rem; color:var(--muted); white-space:nowrap; }
  .sections details { margin:.3rem 0 0 1.7rem; font-size:.9rem; }
  .sections summary { cursor:pointer; color:var(--accent); }
  textarea { width:100%; box-sizing:border-box; font:15px/1.5 system-ui, sans-serif; min-height:14rem; padding:.5rem; margin-top:.4rem; color:var(--fg); background:var(--bg); border:1px solid var(--line); }
  .total { position:sticky; top:0; background:var(--bg); padding:.5rem 0; border-bottom:1px solid var(--line); font-weight:600; z-index:1; }
  .voices { display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr)); gap:.5rem; }
  .voices label { display:flex; gap:.5rem; align-items:center; font-weight:400; margin:0; border:1px solid var(--line); border-radius:8px; padding:.4rem .6rem; }
  .voices audio { height:2rem; width:9rem; margin-left:auto; }
  .faq dt { font-weight:600; margin-top:.8rem; } .faq dd { margin:0; color:var(--muted); }
  footer { margin-top:3rem; font-size:.85rem; color:var(--muted); }
  table { border-collapse:collapse; } td, th { padding:.3rem .8rem; border-bottom:1px solid var(--line); text-align:left; }
</style>
</head>
<body>
<a class="brand" href="/">narrator.guru</a>
{% block body %}{% endblock %}
<footer>narrator.guru · DRM-free EPUB and PDF to M4B audiobook · no subscription</footer>
</body>
</html>
