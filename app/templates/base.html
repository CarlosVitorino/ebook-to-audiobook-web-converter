<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}narrator.guru: ebook to audiobook{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  /* Dark only, on purpose: it's the look of the product, not a user setting.
     Plain and a little old-fashioned: one column, serif headings, thin rules, square buttons. */
  :root {
    color-scheme:dark;
    --bg:#141312; --panel:#1b1a18; --field:#0f0e0d;
    --fg:#e8e4dc; --muted:#9d978c; --line:#2f2c28; --edge:#4a4640; --bad:#ef8a80;
    --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, Cambria, serif;
  }
  * { box-sizing:border-box; }
  body { font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg);
         max-width:38rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; }
  h1 { font-size:2rem; line-height:1.15; margin:1.8rem 0 .6rem; }
  h2 { font-size:1.3rem; line-height:1.25; margin:2.4rem 0 .6rem; }
  p { margin:.6rem 0; }
  a { color:var(--fg); text-decoration:underline; text-decoration-color:var(--edge); text-underline-offset:.2em; }
  a:hover { text-decoration-color:var(--fg); }
  hr { border:0; border-top:1px solid var(--line); margin:2rem 0; }
  .lede { color:var(--muted); font-size:1.05rem; }
  .small { font-size:.88rem; color:var(--muted); }
  .error { color:var(--bad); }

  /* header and footer */
  .top { display:flex; flex-wrap:wrap; gap:.2rem 1rem; align-items:baseline; justify-content:space-between;
         padding-bottom:.8rem; border-bottom:1px solid var(--line); }
  .brand { font-family:var(--serif); font-weight:700; font-size:1.15rem; text-decoration:none; }
  .who { font-size:.85rem; color:var(--muted); margin:0; }
  footer { margin-top:3.5rem; padding-top:.8rem; border-top:1px solid var(--line); font-size:.85rem; color:var(--muted); }

  /* forms */
  .box { background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:1.1rem 1.2rem; margin:1.2rem 0; }
  label { display:block; font-weight:600; margin:.2rem 0 .4rem; }
  input[type=email], input[type=file], textarea {
    width:100%; font:inherit; color:var(--fg); background:var(--field);
    border:1px solid var(--edge); border-radius:3px; padding:.45rem .6rem; }
  input[type=file] { padding:.35rem; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  input[type=checkbox], input[type=radio] { accent-color:var(--fg); width:1rem; height:1rem; }
  .check { display:flex; gap:.6rem; align-items:flex-start; font-weight:400; margin:.8rem 0; }
  .check input { margin-top:.3rem; flex:none; }

  /* buttons: solid for the one thing to do on a page, outlined for everything else */
  button, .button, input[type=file]::file-selector-button {
    display:inline-block; font:inherit; font-size:.95rem; font-weight:600; line-height:1.2; cursor:pointer;
    color:var(--bg); background:var(--fg); border:1px solid var(--fg); border-radius:3px;
    padding:.55rem 1.1rem; text-decoration:none; }
  button:hover, .button:hover { background:#fff; border-color:#fff; }
  .actions { margin-top:1rem; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .secondary, input[type=file]::file-selector-button { color:var(--fg); background:transparent; border-color:var(--edge); font-weight:500; }
  .secondary:hover { background:transparent; border-color:var(--fg); }
  input[type=file]::file-selector-button { margin-right:.7rem; padding:.35rem .8rem; }
  button.link { background:none; border:0; padding:0; color:var(--muted); font-weight:400; font-size:inherit; text-decoration:underline; text-underline-offset:.2em; }
  button.link:hover { color:var(--fg); }
  .buy { font-size:.85rem; padding:.3rem .8rem; }

  /* tables: prices and stats */
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--line); }
  th { font-size:.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  td.num, th.num { text-align:right; }
  tr.free td { color:var(--muted); }

  /* step 2 */
  .steps { font-size:.85rem; color:var(--muted); margin:1.2rem 0 0; }
  .steps b { color:var(--fg); font-weight:600; }
  .total { position:sticky; top:0; z-index:1; background:var(--bg); padding:.6rem 0; border-bottom:1px solid var(--edge); font-weight:600; }
  .sections, .voices, .books { list-style:none; padding:0; margin:0 0 1rem; }
  .sections li, .voices li, .books li { border-bottom:1px solid var(--line); padding:.6rem 0; }
  .row { display:flex; gap:.7rem; align-items:baseline; }
  .row > input { position:relative; top:.15rem; flex:none; }
  .name { flex:1; min-width:0; margin:0; font-weight:400; }
  .name .t { font-weight:600; }
  .off .name { color:var(--muted); }
  .off .name .t { font-weight:400; text-decoration:line-through; }
  .preview { display:block; font-size:.85rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .words { font-size:.85rem; color:var(--muted); white-space:nowrap; }
  .sections details { margin:.25rem 0 0 1.7rem; font-size:.9rem; }
  .sections summary { cursor:pointer; color:var(--muted); }
  .sections summary:hover { color:var(--fg); }
  textarea { font-size:15px; line-height:1.5; min-height:14rem; margin-top:.4rem; }
  .voices .row { align-items:center; }
  .voices .row > input { top:0; }
  .voices audio { height:2rem; width:10rem; flex:none; }

  .faq dt { font-weight:600; margin-top:1rem; } .faq dd { margin:.2rem 0 0; color:var(--muted); }
  progress { width:100%; height:.6rem; accent-color:var(--fg); }
  @media (max-width:30rem) { h1 { font-size:1.65rem; } .voices audio { width:7.5rem; } }
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">narrator.guru</a>
{% if user %}<form method="post" action="/signout" class="who">{{ user.email }} · {{ balance }} book{{ 's' if balance != 1 }} left · <button class="link">Sign out</button></form>{% endif %}
</header>
{% block body %}{% endblock %}
<footer>narrator.guru · DRM-free EPUB and PDF to M4B audiobooks · no subscription</footer>
</body>
</html>
