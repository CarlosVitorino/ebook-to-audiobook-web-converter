services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    # Values come from a .env file next to this one (see .env.example). All are optional locally.
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-narrator.guru <hello@narrator.guru>}
      CREEM_API_KEY: ${CREEM_API_KEY:-}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
      CREEM_API_BASE: ${CREEM_API_BASE:-https://test-api.creem.io}
      CREEM_PRODUCT_ONE: ${CREEM_PRODUCT_ONE:-}
      CREEM_PRODUCT_FIVE: ${CREEM_PRODUCT_FIVE:-}
      CREEM_PRODUCT_FIFTEEN: ${CREEM_PRODUCT_FIFTEEN:-}
    restart: unless-stopped
