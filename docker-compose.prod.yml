# On the server: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# HTTPS is not ours any more: the shared Caddy on the `edge` network terminates TLS for every
# site on this host and dials us by the alias below. See docs/shared-host.md.
services:
  web:
    environment:
      FORWARDED_ALLOW_IPS: "*"   # trust the edge proxy's X-Forwarded-For, so rate limits see the real visitor
    ports: !reset []             # nothing on the host; the only way in is through Caddy
    mem_limit: 512m
    networks:
      default: {}
      edge:
        aliases: [narrator-web]

  worker:
    cpus: 5                      # of 8: 2 for Hunting Apps, 1 for Weather Evidence (docs/shared-host.md §3.6)
    cpu_shares: 256              # a weight, not a reservation: it only bites under contention
    mem_limit: 3g
    environment:
      ONNX_THREADS: 5            # match cpus, or ORT sizes its pool from the host's 8 and gets throttled

networks:
  edge:
    external: true
