# Two checks, in rough order of how often they catch something: the image build,
# which is the artefact we actually deploy, and a syntax pass over the app, which
# is all we have until there are tests.
#
# The repo is public, so the minutes are free. The build stays cheap anyway because
# `COPY app app` is the last layer: an app-only change reuses the cached apt, pip
# and model-download layers above it.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, except on main, where
# cancelling would cut a deploy off half-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compile:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # match the Dockerfile, not the newest release

      - run: python -m compileall -q app

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built, not pushed. The point is to find a broken Dockerfile here rather
      # than on the server mid-deploy. The cache matters: without it every run
      # re-downloads ~310 MB of Kokoro model files.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: narrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A Dockerfile that builds can still produce an image that cannot serve a
      # request. Every setting is optional locally, so this needs no secrets.
      - name: Boot the image and fetch a page
        run: |
          docker run -d --name narrator-ci -e RUN_WORKER=0 -p 8000:8000 narrator:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            [ "$code" = "200" ] && echo "up after ${i}s" && exit 0
            sleep 1
          done
          echo "never served a 200; last code: ${code:-none}"
          docker logs narrator-ci
          exit 1

      - if: always()
        run: docker rm -f narrator-ci

  # The server builds the image itself; GitHub holds a key that can only run scripts/deploy.sh
  # with this commit's sha (docs/deploy.md §10).
  deploy:
    name: Deploy
    needs: [compile, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-narrator
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$TARGET" ]; then
            echo "::warning::Deploy secrets are not set; skipping the deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$TARGET" "$GITHUB_SHA"
